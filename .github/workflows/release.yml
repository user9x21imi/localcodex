name: Validate and release preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: migration-v2
      - run: npx tsc --noEmit
        working-directory: migration-v2
      - run: node tests/loop-guard.mjs && node tests/workload.mjs && node tests/terminal-title.mjs && node tests/communication.mjs
      - run: bash -n macos/install.sh && bash -n macos/launch.sh
      - name: PowerShell validation
        shell: pwsh
        run: |
          $all=@()
          Get-ChildItem . -Recurse -Filter *.ps1 | Where-Object FullName -NotMatch node_modules | ForEach-Object {
            $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)
            if($errors){$all+=@($errors)}
          }
          if($all.Count){throw ($all|Out-String)}
          ./tests/hardware.ps1
      - name: Build source installer archive
        run: |
          git archive --format=zip -o LocalCodex-v0.2.0.zip HEAD
          sha256sum LocalCodex-v0.2.0.zip > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 LocalCodex-v0.2.0.zip SHA256SUMS.txt --clobber
          else
            gh release create v0.2.0 LocalCodex-v0.2.0.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "LocalCodex 0.2.0 preview — OpenCode 2" --prerelease --notes-file RELEASE_NOTES.md
          fi
